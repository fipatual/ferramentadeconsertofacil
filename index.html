/* Fallback for hosting outside claude.ai: user's own Anthropic API key, stored locally */
const MODEL='claude-sonnet-5-5';
function imgToB64(file){
  return new Promise((res,rej)=>{
    const u=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{
      const M=1568,sc=Math.min(1,M/Math.max(im.width,im.height));
      const c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);
      res(c.toDataURL('image/jpeg',0.85).split(',')[1]);
    };
    im.onerror=()=>{URL.revokeObjectURL(u);const e=new Error('img');e.code='image_rejected';rej(e)};
    im.src=u;
  });
}
/* Produção (Vercel): a chave fica no servidor, em /api/analisar. No GitHub Pages, cada usuário usa a própria chave. */
const SERVER_AI=!/github\.io$/.test(location.hostname);
async function callAI(url,headers,body,signal){
  let r;
  try{r=await fetch(url,{method:'POST',signal,headers,body:JSON.stringify(body)})}
  catch(e){if(e&&e.name==='AbortError'){const x=new Error('c');x.code='cancelled';throw x}throw e}
  if(!r.ok){const x=new Error('http '+r.status);x.code=(r.status===401||r.status===403)?'bad_key':(r.status===429||r.status===529)?'rate_limited':r.status===400?'image_rejected':'def';throw x}
  const j=await r.json();
  const txt=(j.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('');
  const m=txt.match(/\{[\s\S]*\}/);
  if(!m){const x=new Error('parse');x.code='def';throw x}
  return JSON.parse(m[0]);
}
function keyAI(){
  const key=ls.get('cj-apikey');
  if(!key&&SERVER_AI)return {server:true,images:true,sample:{json:async(prompt,o)=>{
    const data=await imgToB64(o.images);
    return callAI('/api/analisar',{'content-type':'application/json'},{prompt,image:data},o.signal);
  }}};
  if(!key)return {needKey:true};
  return {own:true,images:true,sample:{json:async(prompt,o)=>{
    const data=await imgToB64(o.images);
    return callAI('https://api.anthropic.com/v1/messages',
      {'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      {model:MODEL,max_tokens:2500,messages:[{role:'user',content:[
        {type:'image',source:{type:'base64',media_type:'image/jpeg',data}},{type:'text',text:prompt}]}]},o.signal);
  }}};
}

const aiReady=(async()=>{
  try{
    if(!window.claude||!window.claude.use)return keyAI();
    const s=await window.claude.use('sample');
    if(!s)return {};
    let images=false;
    try{const l=await s.limits();images=!!(l&&l.images)}catch(_){}
    return {sample:s,images};
  }catch(_){return {}}
})();

function buildPrompt(){
  const br=state.market==='BR';
  const lg=br?'Brazilian Portuguese':'American English';
  const cur=br?'Brazilian reais (BRL)':'US dollars (USD)';
  const shops=br?'Mercado Livre, Leroy Merlin, Amazon Brasil':"Home Depot, Lowe's, Amazon";
  return `You are an experienced home-repair technician helping a homeowner. Look at the attached photo and diagnose the household problem it shows.
Write every text field in ${lg}. Express all money in ${cur} as typical retail or labor prices in that country. Parts will be searched on ${shops}, so each part needs a short, generic "term" that works as a search query in ${lg} (no brand names, no invented model numbers).
${state.note.trim()?`The homeowner adds: "${state.note.trim().slice(0,400)}"\n`:''}Rules:
- If the photo does not show a repairable household problem, reply with {"identified": false, "message": "one short sentence saying what you see and what photo would help"}.
- "complexity" is an integer 1 to 5 (1 = anyone can do it, 2 = easy with basic tools, 3 = needs care and some experience, 4 = difficult or risky for a beginner, 5 = professional only). Electrical panels or wiring, gas, structural cracks, roofing at height and anything with fire or flooding risk must be 4 or 5.
- "category" must be exactly one of: plumbing, electrical, wall, carpentry, tiling, appliance, hvac, locks, general.
- Times are in minutes. Be realistic and include only active work time.
- At most 8 tools, 6 parts, 7 steps, 4 safety notes, 4 "pro_if" items. Keep each string under 140 characters.
Reply with only one JSON object, no other text, in this shape:
{"identified": true, "problem": "short name", "category": "plumbing", "confidence": 0-100, "summary": "what is wrong in one sentence", "cause": "most likely cause", "complexity": 2, "diy_minutes": {"min": 30, "max": 60}, "pro_minutes": {"min": 30, "max": 60}, "diy_cost": {"min": 20, "max": 60}, "pro_cost": {"min": 150, "max": 300}, "urgent": false, "tools": [{"name": "...", "essential": true}], "parts": [{"name": "...", "term": "...", "qty": "1", "price": {"min": 10, "max": 40}}], "steps": ["..."], "safety": ["..."], "pro_if": ["..."]}`;
}

const num=(x,d)=>{const n=Number(x);return isFinite(n)?n:d};
function rng(o,d){
  let a,b;
  if(Array.isArray(o)){a=num(o[0],NaN);b=num(o[1],NaN)}
  else if(o&&typeof o==='object'){a=num(o.min,NaN);b=num(o.max,NaN)}
  return (isFinite(a)&&isFinite(b))?[Math.min(a,b),Math.max(a,b)]:d;
}
const strs=(a,n)=>Array.isArray(a)?a.map(x=>String(x||'').trim()).filter(Boolean).slice(0,n):[];

function normalize(d){
  if(!d||typeof d!=='object'||d.identified===false||!d.problem)return {unidentified:true,message:d&&d.message?String(d.message):''};
  const cat=CATS[d.category]?d.category:'general';
  const tools=(Array.isArray(d.tools)?d.tools:[]).slice(0,8).map(x=>typeof x==='string'?{name:x,e:true}:{name:String(x&&x.name||'').trim(),e:x&&x.essential!==false}).filter(x=>x.name);
  const parts=(Array.isArray(d.parts)?d.parts:[]).slice(0,6).map(p=>({name:String(p&&p.name||'').trim(),term:String(p&&(p.term||p.name)||'').trim(),qty:String(p&&p.qty||'1'),pr:rng(p&&p.price,null)})).filter(p=>p.name&&p.term);
  return {src:'ai',market:state.market,lang:lang(),problem:String(d.problem).trim().slice(0,90),cat,
    conf:Math.max(0,Math.min(100,Math.round(num(d.confidence,0)))),summary:String(d.summary||'').trim(),cause:String(d.cause||'').trim(),
    cx:Math.max(1,Math.min(5,Math.round(num(d.complexity,3)))),
    tDiy:rng(d.diy_minutes,[30,90]),tPro:rng(d.pro_minutes,[30,90]),cDiy:rng(d.diy_cost,null),cPro:rng(d.pro_cost,null),
    urgent:!!d.urgent,tools,parts,steps:strs(d.steps,7),safety:strs(d.safety,4),proIf:strs(d.pro_if,4),ts:Date.now()};
}

function fromKB(k){

function saveRecent(r){
  const list=[r,...state.recents.filter(x=>!(x.problem===r.problem&&x.market===r.market))].slice(0,5);

async function analyze(refresh){
  const t=T();
  if(!state.file)return;
  const ai=state.ai||await aiReady;state.ai=ai;
  if(!(ai.sample&&ai.images)){state.error={msg:t.aiOff};state.view='home';render();return}
  state.error=null;state.view='loading';state.stage=0;render();
  clearInterval(stageTimer);
  stageTimer=setInterval(()=>{state.stage=Math.min(state.stage+1,t.stages.length-1);const el=$('#stage');if(el)el.textContent=t.stages[state.stage]},3500);
  ctl=new AbortController();
  try{
    const data=await ai.sample.json(buildPrompt(),{images:state.file,signal:ctl.signal,cache:refresh?{gcTime:300000,refresh:true}:true});
    clearInterval(stageTimer);
    const r=normalize(data);
    state.result=r;state.checks={};state.feel=null;
    if(!r.unidentified)saveRecent(r);
    state.view='result';render();window.scrollTo(0,0);
  }catch(e){
    clearInterval(stageTimer);
    if(e&&e.code==='cancelled'){state.view='home';render();return}
    const code=e&&e.code;
    state.error={msg:(t.err[code]||t.err.def)};
    state.view='home';render();
  }
}

function fmtTime(r){
  const pt=lang()==='pt';
  const f=m=>m<60?Math.round(m)+' min':(Math.round(m/30)/2).toString().replace('.',pt?',':'.')+' h';
  return r[0]===r[1]?f(r[0]):f(r[0])+' – '+f(r[1]);
}
function fmtMoney(r,market){
  if(!r)return '—';
  const c=CUR[market]||CUR.BR;
  const f=n=>c.sym+Math.round(n).toLocaleString(c.loc);
  return r[0]===r[1]?f(r[0]):f(r[0])+' – '+f(r[1]);
}

     <p style="font-weight:600">${t.dropT}</p>
     <div class="row" style="width:100%"><button class="btn primary" data-act="take">${t.take}</button><button class="btn" data-act="gallery">${t.gallery}</button></div>`;
  const form=state.url?`
    <div class="sec"><label class="l" for="note">${t.note}</label>
    <textarea id="note" placeholder="${esc(t.notePh)}">${esc(state.note)}</textarea></div>
    <button class="btn primary block" data-act="analyze">${t.analyze}</button>`:'';
  const rec=state.recents.length?`<section class="sec"><h2>${t.recents}</h2>${state.recents.map((r,i)=>`
    <button class="recent" data-act="recent" data-i="${i}"><span><b>${esc(r.problem)}</b><br><span class="small">${esc(CATS[r.cat]?CATS[r.cat][r.lang||lg]:'')} · ${r.cx}/5</span></span><span class="mono">${r.market}</span></button>`).join('')}</section>`:'';
  return `<div class="stack">
    <div><div class="ruler" aria-hidden="true"></div><h1>${t.h1}</h1><p class="lede">${t.lede}</p></div>
    ${state.error?`<div class="notice err" role="alert">${esc(state.error.msg)}</div>`:''}
    <div class="drop">${photo}</div>
    <div class="status" id="aistat"></div>
    <div class="notice" id="ainote" hidden>${t.keyT}
      <div style="display:flex;gap:6px;margin-top:8px"><input id="apikey" type="password" autocomplete="off" placeholder="${t.keyPh}" style="flex:1;min-width:0;padding:8px;font:inherit;border:1px solid #bbb;border-radius:6px"><button class="btn" data-act="savekey">${t.keySave}</button></div>
      <div style="margin-top:6px"><a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">${t.keyGet}</a></div></div>
    ${form}
    <section class="sec"><h2>${t.common}</h2><p class="small">${t.commonNote}</p>
      <div class="chips">${KB.map(k=>`<button class="chip" data-act="kb" data-id="${k.id}">${esc(k.problem[lg])}</button>`).join('')}</div></section>
    ${rec}
    <div><button class="chip" data-act="brand">${lg==='pt'?'Identidade visual':'Brand identity'}</button></div>
  </div>`;
}

function viewBrand(){
  const lg=lang(),x=(pt,en)=>lg==='pt'?pt:en;
  const lockup=(cls)=>`<div class="lock"><svg class="logo" aria-hidden="true"><use href="#logo"/></svg><span>Conserta <em>Já</em></span></div>`;
  const sw=(n,hex,bg,fg,line)=>`<div style="background:${bg};color:${fg};${line?'border:1px solid var(--line);':''}"><b>${n}</b>${hex}</div>`;
  return `<div class="stack" style="padding-top:8px">
    <div><div class="eyebrow">${x('Identidade visual','Brand identity')}</div><h1>Conserta Já</h1>
      <p class="lede">${x('Foto, diagnóstico, conserto.','Photo, diagnosis, fix.')}</p></div>

    <div class="tile" style="background:var(--surface);padding-block:32px"><svg class="hero-logo" aria-label="Logo"><use href="#logo"/></svg>${lockup()}</div>

    <section class="sec"><h2>${x('Versões','Versions')}</h2>
      <div class="grid2">
        <div class="tile" style="background:var(--bg)"><svg class="logo" style="width:56px;height:56px" aria-hidden="true"><use href="#logo"/></svg><small>${x('Sobre fundo claro','On light')}</small></div>
        <div class="tile" style="background:#0B1220;border-color:#25304A;--ink:#E8ECF6;--accent:#8AA4FF;--accent-ink:#0B1220"><svg class="logo" style="width:56px;height:56px" aria-hidden="true"><use href="#logo"/></svg><small>${x('Sobre fundo escuro','On dark')}</small></div>
        <div class="tile" style="background:var(--bg)"><div class="icon-sq" style="background:#1F46D6;--ink:#fff;--accent:#fff;--accent-ink:#1F46D6"><svg aria-hidden="true"><use href="#logo"/></svg></div><small>${x('Ícone do app','App icon')}</small></div>
        <div class="tile" style="background:#fff;border-color:#D5DBE6;--ink:#0E1A33;--accent:#0E1A33;--accent-ink:#fff"><svg class="logo" style="width:56px;height:56px" aria-hidden="true"><use href="#logo"/></svg><small style="color:#0E1A33">${x('Uma cor (carimbo, recibo)','One color (stamp, receipt)')}</small></div>
      </div></section>

    <section class="sec"><h2>${x('Conceito','Concept')}</h2><div class="card" style="display:flex;flex-direction:column;gap:14px">
      <div class="concept"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" aria-hidden="true"><path d="M4 15V9a5 5 0 0 1 5-5h6M33 4h6a5 5 0 0 1 5 5v6M44 33v6a5 5 0 0 1-5 5h-6M15 44H9a5 5 0 0 1-5-5v-6"/></svg><div><b>${x('Mira da câmera','Camera viewfinder')}</b><p class="small">${x('Os quatro cantos enquadram o problema. É o primeiro passo do app: a foto.','The four corners frame the problem. It is the first step of the app: the photo.')}</p></div></div>
      <div class="concept"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 12.5 36.5 23.8V35.5a1.5 1.5 0 0 1-1.5 1.5H13a1.5 1.5 0 0 1-1.5-1.5V23.8Z" fill="var(--accent)" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/></svg><div><b>${x('Casa','Home')}</b><p class="small">${x('O defeito mora dentro de uma casa, e é ela que o app protege.','The fault lives inside a home, and that is what the app looks after.')}</p></div></div>
      <div class="concept"><svg viewBox="0 0 48 48" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M21.4 24.4A5.3 5.3 0 1 0 26.6 24.4"/></svg><div><b>${x('Boca de chave','Wrench jaw')}</b><p class="small">${x('O recorte no centro é a ferramenta: o conserto acontece dentro do enquadramento.','The cut-out at the center is the tool: the fix happens inside the frame.')}</p></div></div>
    </div></section>

    <section class="sec"><h2>${x('Cores','Colors')}</h2>
      <div class="sw">
        ${sw(x('Azul Prumo','Plumb Blue'),'#1F46D6','#1F46D6','#fff')}
        ${sw(x('Noite de Obra','Site Night'),'#0E1A33','#0E1A33','#fff')}
        ${sw(x('Papel de Planta','Blueprint Paper'),'#EDF0F5','#EDF0F5','#0E1A33',true)}
        ${sw(x('Verde Pronto','Ready Green'),'#1F7A4D','#1F7A4D','#fff')}
        ${sw(x('Âmbar Atenção','Caution Amber'),'#9A5B00','#9A5B00','#fff')}
        ${sw(x('Vermelho Pare','Stop Red'),'#B3261E','#B3261E','#fff')}
      </div>
      <p class="small">${x('O azul é a cor da marca e dos botões principais. Verde, âmbar e vermelho aparecem só para indicar a dificuldade do reparo.','Blue is the brand color and marks primary buttons. Green, amber and red appear only to show repair difficulty.')}</p></section>

    <section class="sec"><h2>${x('Tipografia','Typography')}</h2><div class="card">
      <div class="spec"><span class="k">${x('Títulos e marca','Headings and brand')}</span><span style="font:700 34px/1 var(--display);letter-spacing:.04em;text-transform:uppercase">Barlow Condensed</span></div>
      <div class="spec"><span class="k">${x('Texto','Body')}</span><span style="font:400 16px/1.4 var(--body)">IBM Plex Sans. ${x('Instruções claras, frases curtas.','Clear instructions, short sentences.')}</span></div>
      <div class="spec"><span class="k">${x('Medidas e números','Measures and numbers')}</span><span style="font:500 16px/1.4 var(--mono)">1h – 2h · R$ 80 – 300 · 3/5</span></div>
    </div></section>

    <section class="sec"><h2>${x('Régua','Ruler')}</h2><div class="ruler" style="margin:0" aria-hidden="true"></div>
      <p class="small">${x('A régua de marcações separa as etapas e lembra que tudo aqui é medido: tempo, custo e dificuldade.','The tick ruler separates stages and signals that everything here is measured: time, cost and difficulty.')}</p></section>

    <section class="sec"><h2>${x('Tom de voz','Voice')}</h2><ul class="bul">
      <li>${x('Fale como um vizinho que entende de obra: direto, sem jargão.','Speak like a neighbor who knows construction: direct, no jargon.')}</li>
      <li>${x('Diga o número: minutos, reais, nível de 1 a 5.','Give the number: minutes, money, level 1 to 5.')}</li>
      <li>${x('Avise do risco antes do passo a passo.','Warn about risk before the steps.')}</li>
    </ul></section>

    <button class="btn primary block" data-act="home">${x('Voltar ao app','Back to the app')}</button>
  </div>`;
}

function viewLoading(){
  const t=T();
  return `<div class="loading" style="padding-top:12px">
    <div class="scan"><img class="preview" src="${esc(state.url)}" alt=""></div>
    <p class="stage" id="stage">${t.stages[state.stage]}</p>
    <button class="btn" data-act="cancel">${t.cancel}</button></div>`;
}

function viewUnidentified(){
  const t=T(),r=state.result;
  return `<div class="stack" style="padding-top:8px"><h1>${t.nf}</h1>
    ${r.message?`<p>${esc(r.message)}</p>`:''}<p class="lede">${t.nfTip}</p>
    <button class="btn primary block" data-act="home">${t.tryAgain}</button></div>`;
}

function proCard(p,r,t){
  const req=t.msg(r);
  return `<div class="card pro"><div class="who"><div class="av" aria-hidden="true">${esc(p.n.trim()[0])}</div>
    <div style="min-width:0"><b>${esc(p.n)}</b><div class="meta">★ ${p.r} · ${p.j} ${t.jobs}<br>${esc(p.d)} · ${t.away} ${esc(p.eta)}</div></div><span class="ex">${t.example}</span></div>
    <div class="ph">${esc(p.ph)}</div>
    <div class="row"><button class="btn" data-act="copy" data-copy="${esc(p.ph)}">${t.copyPhone}</button><button class="btn" data-act="copy" data-copy="${esc(req)}">${t.copyReq}</button></div></div>`;
}

function viewResult(){
  const r=state.result;
  if(r.unidentified)return viewUnidentified();
  const t=T(),lg=lang(),m=r.market||state.market;
  const lvl=r.cx<=2?'good':r.cx===3?'warn':'crit';
  const vk=r.cx<=2?['vDiy','vDiyS']:r.cx===3?['vMaybe','vMaybeS']:['vPro','vProS'];
  const showPros=state.feel==='doubt'||state.feel==='pro'||r.cx>=4;
  const catName=(CATS[r.cat]||CATS.general)[lg];
  const stores=STORES[m]||STORES.BR;
  const pros=PROS[m]||PROS.BR;
  const mapUrl='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(t.mapQ(catName));
  return `<div class="stack">
   <div class="titlebox">${state.url&&r.src==='ai'?`<img class="thumb" src="${esc(state.url)}" alt="">`:''}
     <div style="min-width:0"><div class="eyebrow">${esc(catName)}</div><h1>${esc(r.problem)}</h1>
     <div class="tags"><span class="tag">${r.src==='ai'?t.ai:t.guide}</span>${r.src==='ai'?`<span class="tag">${r.conf}% ${t.conf}</span>`:''}${r.urgent?`<span class="tag crit">${t.urgent}</span>`:''}</div></div></div>
   <div><p>${esc(r.summary)}</p>${r.cause?`<p class="small" style="margin-top:6px">${esc(r.cause)}</p>`:''}</div>

   <div class="card c-${lvl}"><div class="k">${t.cx}</div>
     <div style="display:flex;justify-content:space-between;align-items:baseline;margin:8px 0 10px"><span class="lvl" style="color:var(--c)">${t.lv[r.cx-1]}</span><span class="mono">${r.cx}/5</span></div>
     <div class="meter" aria-hidden="true">${[1,2,3,4,5].map(i=>`<i class="${i<=r.cx?'on':''}"></i>`).join('')}</div>
     <div class="ticks" aria-hidden="true">${[1,2,3,4,5].map(i=>`<span>${i}</span>`).join('')}</div></div>

   <div class="grid2">
     <div class="card"><div class="k">${t.time}</div><div class="big"><small>${t.diy}</small>${fmtTime(r.tDiy)}</div><div class="big"><small>${t.pro}</small>${fmtTime(r.tPro)}</div></div>
     <div class="card"><div class="k">${t.cost}</div><div class="big"><small>${t.diy}</small>${fmtMoney(r.cDiy,m)}</div><div class="big"><small>${t.pro}</small>${fmtMoney(r.cPro,m)}</div></div>
   </div>

   <div class="verdict v-${lvl}"><b>${t[vk[0]]}</b><p style="margin-top:6px">${t[vk[1]]}</p></div>

   ${r.tools.length?`<section class="sec"><h2>${t.tools}</h2><div class="card" style="padding-block:6px">${r.tools.map((x,i)=>`
     <button class="chk" role="checkbox" aria-checked="${state.checks['t'+i]?'true':'false'}" data-act="check" data-k="t${i}"><span class="box"></span><span class="t">${esc(x.name)}${x.e?'':`<span class="opt">${t.opt}</span>`}</span></button>`).join('')}</div></section>`:''}

   ${r.parts.length?`<section class="sec"><h2>${t.parts}</h2><div class="card">${r.parts.map(p=>`
     <div class="part"><div class="h"><b>${esc(p.name)}</b><span class="mono">${t.qty} ${esc(p.qty)}${p.pr?' · '+fmtMoney(p.pr,m):''}</span></div>
     <div class="chips"><span class="small" style="align-self:center">${t.buyAt}</span>${stores.map(s=>`<a class="chip" href="${esc(s[1](p.term))}" target="_blank" rel="noopener noreferrer">${esc(s[0])}</a>`).join('')}</div></div>`).join('')}</div></section>`:''}

   ${r.steps.length?`<section class="sec"><h2>${t.steps}</h2><ol class="steps">${r.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol></section>`:''}

   ${r.safety.length?`<section class="sec"><h2>${t.safety}</h2><ul class="bul c-warn">${r.safety.map(s=>`<li>${esc(s)}</li>`).join('')}</ul></section>`:''}
   ${r.proIf.length?`<section class="sec"><h2>${t.proIf}</h2><ul class="bul c-crit">${r.proIf.map(s=>`<li>${esc(s)}</li>`).join('')}</ul></section>`:''}

   <section class="sec"><h2>${t.feelQ}</h2><div class="feel">${t.feel.map((f,i)=>{const v=['can','doubt','pro'][i];return `<button data-act="feel" data-v="${v}" aria-pressed="${state.feel===v}">${f}</button>`}).join('')}</div>
     ${state.feel==='can'&&r.cx>=4?`<div class="notice">${t.feelCan}</div>`:''}</section>

   ${showPros?`<section class="sec" id="pros"><h2>${t.pros}</h2><p class="small">${t.prosNote}</p>
     ${pros.map(p=>proCard(p,r,t)).join('')}
     <a class="btn block" href="${esc(mapUrl)}" target="_blank" rel="noopener noreferrer">${t.near}</a></section>`:''}

   <p class="small">${t.disc}</p>
  </div>`;
}

function render(){
  const t=T(),app=$('#app');
  $('#mBR').setAttribute('aria-pressed',state.market==='BR');
  $('#mUS').setAttribute('aria-pressed',state.market==='US');
  document.documentElement.lang=lang()==='pt'?'pt-BR':'en';
  app.innerHTML=state.view==='loading'?viewLoading():state.view==='result'?viewResult():state.view==='brand'?viewBrand():viewHome();
  const hasBar=state.view==='result'&&state.result&&!state.result.unidentified;
  app.classList.toggle('hasbar',hasBar);
  $('#bar').hidden=!hasBar;
  $('#barNew').textContent=t.newD;$('#barPro').textContent=t.callPro;
  if(state.view==='home')paintAI();
}

/* ---------- actions ---------- */
let toastT;
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),1800)}
async function copy(text){
  const t=T();
  try{await navigator.clipboard.writeText(text);toast(t.copied);return}catch(_){}
  try{const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();toast(ok?t.copied:t.copyFail)}catch(_){toast(t.copyFail)}
}
function showPros(){
  const el=$('#pros');
  if(el)el.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});
}
function setFile(f){
  if(!f)return;
  if(state.url){try{URL.revokeObjectURL(state.url)}catch(_){}}
  state.file=f;state.url=URL.createObjectURL(f);state.error=null;state.view='home';render();
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act;
  if(a==='take')$('#cam').click();
  else if(a==='gallery')$('#gal').click();
  else if(a==='analyze')analyze(false);
  else if(a==='brand'){state.view='brand';render();window.scrollTo(0,0)}
  else if(a==='cancel'){if(ctl)ctl.abort()}
  else if(a==='home'){state.view='home';state.error=null;render();window.scrollTo(0,0)}
  else if(a==='market'){state.market=b.dataset.m;ls.set('cj-market',state.market);state.error=null;render()}
  else if(a==='kb'){const k=KB.find(x=>x.id===b.dataset.id);if(k){state.result=fromKB(k);state.checks={};state.feel=null;state.view='result';render();window.scrollTo(0,0)}}
  else if(a==='recent'){const r=state.recents[Number(b.dataset.i)];if(r){state.result=r;state.checks={};state.feel=null;state.view='result';render();window.scrollTo(0,0)}}
  else if(a==='check'){const k=b.dataset.k;state.checks[k]=!state.checks[k];b.setAttribute('aria-checked',state.checks[k]?'true':'false')}
  else if(a==='feel'){state.feel=b.dataset.v;render();if(state.feel!=='can')showPros()}
  else if(a==='callpro'){state.feel='pro';render();showPros()}
  else if(a==='copy')copy(b.dataset.copy);
  else if(a==='savekey'){const v=($('#apikey').value||'').trim();if(v){ls.set('cj-apikey',v);state.ai=keyAI();state.error=null;render()}}
  else if(a==='delkey'){e.preventDefault();try{localStorage.removeItem('cj-apikey')}catch(_){}state.ai=keyAI();render()}
});
document.addEventListener('input',e=>{if(e.target.id==='note')state.note=e.target.value});
['cam','gal'].forEach(id=>$('#'+id).addEventListener('change',e=>{setFile(e.target.files&&e.target.files[0]);e.target.value=''}));

render();
})();
</script>

</body></html>
